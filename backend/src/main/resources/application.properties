spring.application.name=apionlinestore
server.port=8081
####### Data-Source Properties #######
# Database connection URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/gestproduct}
# Declaration of identifiers used for authentication on MySQL
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# switches the feature on and off and is vendor independent
spring.jpa.generate-ddl=true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# The SQL dialect makes Hibernate generate better SQL for the chosen database
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
